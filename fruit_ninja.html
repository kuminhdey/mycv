<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fruit Ninja Camera - Fullscreen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #050510;
  }

  #webcam { display: none; }

  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #050510;
    cursor: none;
  }

  #toolbar {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    max-width: calc(100vw - 24px);
    pointer-events: auto;
  }

  .btn, #speedSelect {
    height: 34px;
    padding: 0 11px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    background: rgba(0, 188, 212, .86);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.28);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .btn:hover, #speedSelect:hover { transform: translateY(-1px); background: rgba(0, 229, 255, .95); }
  .btn:active { transform: scale(.97); }

  #speedSelect {
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background: rgba(24, 24, 38, .82);
  }

  #status {
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 9999;
    color: #d7faff;
    font-size: 13px;
    text-align: center;
    padding: 8px 13px;
    border-radius: 999px;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    max-width: calc(100vw - 24px);
  }

  #startOverlay {
    position: fixed;
    inset: 0;
    z-index: 9998;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, rgba(0,188,212,.18), rgba(0,0,0,.88) 56%, rgba(0,0,0,.95));
    color: white;
    text-align: center;
    padding: 24px;
  }

  #startBox {
    width: min(560px, calc(100vw - 32px));
    padding: 28px 22px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 24px;
    background: rgba(10, 12, 28, .68);
    box-shadow: 0 24px 80px rgba(0,0,0,.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  #startBox h1 {
    font-size: clamp(34px, 7vw, 64px);
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(0,229,255,.72);
  }

  #startBox p {
    color: #d7d7d7;
    line-height: 1.5;
    margin: 8px 0;
    font-size: 15px;
  }

  #startBtn {
    margin-top: 18px;
    height: 46px;
    padding: 0 28px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #00e5ff, #00ff88);
    color: #021015;
    font-weight: 900;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,229,255,.33);
  }

  #startBtn:active { transform: scale(.97); }

  @media (max-width: 720px) {
    #toolbar {
      top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left));
      gap: 6px;
    }
    .btn, #speedSelect {
      height: 30px;
      padding: 0 9px;
      font-size: 12px;
    }
    #status { font-size: 12px; }
  }
</style>
</head>
<body>
  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="toolbar">
    <button class="btn" id="fullscreenBtn" title="Phím F">⛶ Full</button>
    <button class="btn" id="restartBtn" title="Phím R">🔄 Restart</button>
    <button class="btn" id="pauseBtn" title="Phím Space/P">⏸ Pause</button>
    <select id="speedSelect" title="Tốc độ game">
      <option value="0.75">Chậm</option>
      <option value="1" selected>Vừa</option>
      <option value="1.25">Nhanh</option>
      <option value="1.55">Rất nhanh</option>
    </select>
  </div>

  <div id="status">Bấm Start để mở camera...</div>

  <div id="startOverlay">
    <div id="startBox">
      <h1>🍉 Fruit Ninja</h1>
      <p>Dùng đầu ngón trỏ để chém trái cây. Tránh bom 💣.</p>
      <p>Có item đặc biệt: ⭐ x2 điểm, ❤️ thêm mạng, 🧊 làm chậm.</p>
      <p>PC: F = Fullscreen, R = Restart, Space/P = Pause.</p>
      <button id="startBtn">▶ Start Game</button>
    </div>
  </div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

// DOM
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const video = document.getElementById('webcam');
const statusEl = document.getElementById('status');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');
const speedSelect = document.getElementById('speedSelect');

// Canvas responsive
let W = 0;
let H = 0;
let DPR = 1;
function resizeGame() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.floor(window.innerWidth);
  H = Math.floor(window.innerHeight);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resizeGame();
window.addEventListener('resize', resizeGame);
document.addEventListener('fullscreenchange', () => {
  fullscreenBtn.textContent = document.fullscreenElement ? '❎ Exit' : '⛶ Full';
  resizeGame();
});

// Mobile/fullscreen support
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (!document.documentElement.requestFullscreen || isIOS) {
  // iOS Safari không cho fullscreen toàn document, nên ẩn nút để tránh bấm không có tác dụng.
  fullscreenBtn.style.display = 'none';
}

// Game config
const MAX_LIVES = 5;
const WIN_SCORE = 80;
const TRAIL_LEN_PC = 24;
const TRAIL_LEN_MOBILE = 16;
const BASE_INTERVAL = 1120;
const GRAVITY_BASE = 0.34;
const MAX_OBJECTS = 9;
const IS_MOBILE = matchMedia('(pointer: coarse)').matches || innerWidth < 760;
const TARGET_FPS = IS_MOBILE ? 30 : 60;
const DETECT_EVERY_MS = IS_MOBILE ? 80 : 33;

const FRUITS = [
  { type:'fruit', name:'watermelon', label:'🍉', color:'#22aa22', inner:'#ff4466', r:42, points:1 },
  { type:'fruit', name:'orange',     label:'🍊', color:'#ff8800', inner:'#ffaa44', r:32, points:1 },
  { type:'fruit', name:'apple',      label:'🍎', color:'#cc2222', inner:'#ff6666', r:30, points:1 },
  { type:'fruit', name:'banana',     label:'🍌', color:'#ddcc00', inner:'#ffee44', r:28, points:1 },
  { type:'fruit', name:'strawberry', label:'🍓', color:'#cc2244', inner:'#ff6688', r:24, points:1 },
  { type:'fruit', name:'grape',      label:'🍇', color:'#882299', inner:'#bb55cc', r:24, points:1 },
];

const ITEMS = [
  { type:'item', name:'double', label:'⭐', color:'#ffd700', inner:'#fff2a0', r:28 },
  { type:'item', name:'life',   label:'❤️', color:'#ff3355', inner:'#ff9aaa', r:28 },
  { type:'item', name:'slow',   label:'🧊', color:'#44d9ff', inner:'#c9f7ff', r:28 },
];

const BOMB = { type:'bomb', name:'bomb', label:'💣', color:'#1b1b1b', inner:'#555', r:30 };

// State
let handLandmarker = null;
let lastVideoTime = -1;
let lastDetectMs = 0;
let lastFrameMs = 0;
let objects = [];
let particles = [];
let trail = [];
let fingertip = null;
let score = 0;
let highScore = Number(localStorage.getItem('fruit_ninja_high_score') || 0);
let lives = MAX_LIVES;
let gameOver = false;
let paused = false;
let lastSpawn = 0;
let flashRed = 0;
let shakeFrames = 0;
let comboCount = 0;
let comboTime = 0;
let gameSpeed = 1;
let scoreMultiplier = 1;
let multiplierUntil = 0;
let slowUntil = 0;
let initialized = false;
let running = false;

speedSelect.addEventListener('change', () => {
  gameSpeed = Number(speedSelect.value || 1);
});

function rand(min, max) { return min + Math.random() * (max - min); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function nowMs() { return performance.now(); }

function lighten(hex, amt) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}

class Particle {
  constructor(x, y, color, power = 1) {
    const a = Math.random() * Math.PI * 2;
    const s = rand(2.5, 8.5) * power;
    this.x = x;
    this.y = y;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s - rand(1, 3);
    this.color = color;
    this.life = 1;
    this.r = rand(2, 6);
  }
  update(dt) {
    const k = dt / 16.67;
    this.x += this.vx * k;
    this.y += this.vy * k;
    this.vy += 0.28 * k;
    this.life -= 0.032 * k;
    return this.life > 0;
  }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class FlyingObject {
  constructor(forcedInfo = null) {
    const info = forcedInfo || pickObjectInfo();
    Object.assign(this, info);
    this.r = Math.round(this.r * clamp(Math.min(W, H) / 700, 0.78, 1.35));
    this.x = rand(this.r + 30, W - this.r - 30);
    this.y = H + this.r + rand(8, 80);
    this.vx = rand(-3.8, 3.8) * clamp(W / 1280, .8, 1.35);

    // Bay cao hơn cho màn hình lớn.
    const heightBoost = clamp(H / 720, 0.9, 1.45);
    this.vy = -rand(15.0, 20.5) * heightBoost;
    this.rot = rand(0, 360);
    this.rspd = rand(-7, 7);
    this.sliced = false;
    this.missed = false;
  }

  update(dt) {
    const k = dt / 16.67;
    const slowFactor = nowMs() < slowUntil ? 0.62 : 1;
    const spd = gameSpeed * slowFactor;
    this.vy += GRAVITY_BASE * k * spd;
    this.x += this.vx * k * spd;
    this.y += this.vy * k * spd;
    this.rot += this.rspd * k * spd;

    if (this.x < this.r || this.x > W - this.r) this.vx *= -0.82;

    if (this.y > H + this.r + 80) {
      if (!this.sliced) this.missed = true;
      return false;
    }
    return true;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot * Math.PI / 180);

    // Shadow
    ctx.save();
    ctx.translate(0, this.r + 5);
    ctx.scale(1, 0.25);
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.fill();
    ctx.restore();

    // Body
    const grad = ctx.createRadialGradient(-this.r * .33, -this.r * .33, 2, 0, 0, this.r);
    grad.addColorStop(0, lighten(this.color, 72));
    grad.addColorStop(1, this.color);
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = Math.max(2, this.r * .06);
    ctx.strokeStyle = this.type === 'bomb' ? 'rgba(255,80,80,.65)' : 'rgba(255,255,255,.42)';
    ctx.stroke();

    // Label
    ctx.font = `${this.r * 1.08}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.label, 0, 2);

    ctx.restore();
  }

  hitTest(points) {
    if (this.sliced || points.length < 2) return false;
    const bonus = IS_MOBILE ? 2.65 : 2.25;
    for (let i = 1; i < points.length; i++) {
      const x1 = points[i-1].x, y1 = points[i-1].y;
      const x2 = points[i].x, y2 = points[i].y;
      const dx = x2 - x1, dy = y2 - y1;
      const len2 = dx*dx + dy*dy;
      if (len2 < 1) continue;
      const t = clamp(((this.x-x1)*dx + (this.y-y1)*dy) / len2, 0, 1);
      const nx = x1 + t * dx;
      const ny = y1 + t * dy;
      if (Math.hypot(this.x - nx, this.y - ny) < this.r * bonus) return true;
    }
    return false;
  }
}

function pickObjectInfo() {
  const r = Math.random();
  const bombChance = clamp(0.10 + score * 0.0018, 0.10, 0.22);
  const itemChance = 0.13;
  if (r < bombChance) return BOMB;
  if (r < bombChance + itemChance) return ITEMS[Math.floor(Math.random() * ITEMS.length)];
  return FRUITS[Math.floor(Math.random() * FRUITS.length)];
}

function addParticles(obj, count = 24, power = 1) {
  for (let i = 0; i < count; i++) particles.push(new Particle(obj.x, obj.y, obj.color, power));
  if (obj.inner) for (let i = 0; i < Math.floor(count / 2); i++) particles.push(new Particle(obj.x, obj.y, obj.inner, power));
}

function spawnInterval() {
  const slowFactor = nowMs() < slowUntil ? 1.4 : 1;
  return clamp((BASE_INTERVAL - score * 7) * slowFactor / gameSpeed, 440, 1300);
}

function maybeSpawn(t) {
  if (objects.length >= MAX_OBJECTS) return;
  if (t - lastSpawn > spawnInterval()) {
    const batch = Math.random() < clamp(score / 120, .10, .45) ? Math.floor(rand(2, 4)) : 1;
    for (let i = 0; i < batch && objects.length < MAX_OBJECTS; i++) objects.push(new FlyingObject());
    lastSpawn = t;
  }
}

function sliceObject(obj) {
  obj.sliced = true;
  comboCount++;
  comboTime = nowMs();

  if (obj.type === 'bomb') {
    lives--;
    comboCount = 0;
    flashRed = 20;
    shakeFrames = 18;
    addParticles(obj, 28, 1.25);
    if (lives <= 0) endGame();
    return;
  }

  if (obj.type === 'item') {
    if (obj.name === 'double') {
      scoreMultiplier = 2;
      multiplierUntil = nowMs() + 9000;
    } else if (obj.name === 'life') {
      lives = Math.min(MAX_LIVES, lives + 1);
    } else if (obj.name === 'slow') {
      slowUntil = nowMs() + 7000;
    }
    addParticles(obj, 34, 1.2);
    score += 2;
    return;
  }

  if (nowMs() > multiplierUntil) scoreMultiplier = 1;
  const comboBonus = comboCount >= 5 ? 2 : comboCount >= 3 ? 1 : 0;
  score += obj.points * scoreMultiplier + comboBonus;
  addParticles(obj, 24, 1);

  if (score >= WIN_SCORE) endGame();
}

function endGame() {
  gameOver = true;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('fruit_ninja_high_score', String(highScore));
  }
}

function resetGame() {
  objects = [];
  particles = [];
  trail = [];
  fingertip = null;
  score = 0;
  lives = MAX_LIVES;
  gameOver = false;
  paused = false;
  flashRed = 0;
  shakeFrames = 0;
  comboCount = 0;
  scoreMultiplier = 1;
  multiplierUntil = 0;
  slowUntil = 0;
  lastSpawn = nowMs();
  pauseBtn.textContent = '⏸ Pause';
}

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  pauseBtn.textContent = paused ? '▶ Resume' : '⏸ Pause';
}

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {
    statusEl.textContent = 'Trình duyệt không hỗ trợ fullscreen cho trang này.';
  }
}

fullscreenBtn.onclick = toggleFullscreen;
restartBtn.onclick = resetGame;
pauseBtn.onclick = togglePause;

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') resetGame();
  if (e.key === 'p' || e.key === 'P' || e.code === 'Space') togglePause();
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'q' || e.key === 'Q' || e.key === 'Escape') {
    if (document.fullscreenElement) document.exitFullscreen();
  }
});

function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#06122a');
  bg.addColorStop(.55, '#08081a');
  bg.addColorStop(1, '#03030b');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Soft decorative glows
  ctx.globalAlpha = .22;
  ctx.fillStyle = '#00e5ff';
  ctx.beginPath();
  ctx.arc(W * .15, H * .2, Math.min(W, H) * .22, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#00ff88';
  ctx.beginPath();
  ctx.arc(W * .88, H * .78, Math.min(W, H) * .18, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawCamera() {
  if (video.readyState >= 2) {
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, -W, 0, W, H);
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,18,.48)';
    ctx.fillRect(0, 0, W, H);
  } else {
    drawBackground();
  }
}

function drawTrail() {
  if (trail.length < 2) return;
  for (let i = 1; i < trail.length; i++) {
    const t = i / trail.length;
    ctx.beginPath();
    ctx.moveTo(trail[i-1].x, trail[i-1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.strokeStyle = `rgba(${Math.floor(80 + t*120)}, ${Math.floor(180 + t*60)}, 255, ${t*.92})`;
    ctx.lineWidth = Math.max(3, t * (IS_MOBILE ? 10 : 8));
    ctx.lineCap = 'round';
    ctx.stroke();
  }
}

function drawFingertip() {
  if (!fingertip) return;
  ctx.beginPath();
  ctx.arc(fingertip.x, fingertip.y, IS_MOBILE ? 20 : 18, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(fingertip.x, fingertip.y, IS_MOBILE ? 11 : 9, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(80,230,255,.92)';
  ctx.fill();
}

function drawHUD() {
  const pad = IS_MOBILE ? 12 : 18;
  const scoreSize = clamp(W / 32, 25, 48);

  ctx.save();
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.font = `900 ${scoreSize}px Arial`;
  ctx.lineWidth = Math.max(4, scoreSize * .13);
  ctx.strokeStyle = 'rgba(0,0,0,.78)';
  ctx.fillStyle = '#ffffff';
  const scoreText = `SCORE ${score}`;
  ctx.strokeText(scoreText, pad, IS_MOBILE ? 52 : 65);
  ctx.fillText(scoreText, pad, IS_MOBILE ? 52 : 65);

  ctx.font = `700 ${Math.max(14, scoreSize * .38)}px Arial`;
  ctx.fillStyle = '#b8f9ff';
  ctx.fillText(`BEST ${highScore}`, pad + 2, (IS_MOBILE ? 52 : 65) + scoreSize + 4);

  if (scoreMultiplier > 1 && nowMs() < multiplierUntil) {
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`⭐ x2: ${Math.ceil((multiplierUntil - nowMs())/1000)}s`, pad + 2, (IS_MOBILE ? 52 : 65) + scoreSize + 26);
  }

  if (nowMs() < slowUntil) {
    ctx.fillStyle = '#8eeeff';
    ctx.fillText(`🧊 slow: ${Math.ceil((slowUntil - nowMs())/1000)}s`, pad + 2, (IS_MOBILE ? 52 : 65) + scoreSize + 48);
  }

  // Lives: đặt trái, dưới toolbar để không bị nút che.
  ctx.textBaseline = 'middle';
  ctx.font = `${IS_MOBILE ? 24 : 32}px serif`;
  const lifeY = IS_MOBILE ? 40 : 38;
  const lifeX = IS_MOBILE ? 12 : 18;
  for (let i = 0; i < MAX_LIVES; i++) {
    ctx.fillStyle = i < lives ? '#ff3355' : 'rgba(255,255,255,.22)';
    ctx.fillText('♥', lifeX + i * (IS_MOBILE ? 26 : 36), lifeY);
  }

  // Combo
  if (comboCount >= 3 && nowMs() - comboTime < 900) {
    const age = (nowMs() - comboTime) / 900;
    ctx.globalAlpha = 1 - age;
    ctx.font = `900 ${clamp(W / 18, 42, 76) - age*10}px Arial`;
    ctx.fillStyle = '#00eeff';
    ctx.shadowColor = '#00eeff';
    ctx.shadowBlur = 28;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`COMBO ×${comboCount}!`, W / 2, H / 2 - 70);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // Footer
  ctx.textBaseline = 'bottom';
  ctx.font = `${IS_MOBILE ? 11 : 13}px Arial`;
  ctx.fillStyle = 'rgba(255,255,255,.48)';
  ctx.textAlign = 'left';
  ctx.fillText(IS_MOBILE ? 'Chạm màn hình nếu camera chưa chạy' : 'F Fullscreen | R Restart | Space Pause', 10, H - 10);
  ctx.textAlign = 'right';
  ctx.fillText('Made by Dang Duc Minh', W - 10, H - 10);
  ctx.restore();
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,.64)';
  ctx.fillRect(0, 0, W, H);
  const win = score >= WIN_SCORE;

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 ${clamp(W/12, 48, 92)}px Arial`;
  ctx.fillStyle = win ? '#00ff88' : '#ff3355';
  ctx.shadowColor = win ? '#00ff88' : '#ff3355';
  ctx.shadowBlur = 28;
  ctx.fillText(win ? '🏆 YOU WIN!' : '💀 GAME OVER', W/2, H/2 - 54);

  ctx.shadowBlur = 0;
  ctx.font = `800 ${clamp(W/32, 24, 42)}px Arial`;
  ctx.fillStyle = '#fff';
  ctx.fillText(`Score: ${score}   |   Best: ${highScore}`, W/2, H/2 + 18);

  ctx.font = `600 ${clamp(W/58, 16, 24)}px Arial`;
  ctx.fillStyle = '#d2d2d2';
  ctx.fillText('Nhấn R hoặc nút Restart để chơi lại', W/2, H/2 + 70);
  ctx.restore();
}

function drawPaused() {
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 ${clamp(W/13, 48, 88)}px Arial`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('⏸ PAUSED', W/2, H/2 - 20);
  ctx.font = `600 ${clamp(W/60, 16, 24)}px Arial`;
  ctx.fillStyle = '#d0d0d0';
  ctx.fillText('Nhấn Space/P hoặc Resume để chơi tiếp', W/2, H/2 + 48);
  ctx.restore();
}

function detectHand(t) {
  if (!handLandmarker || video.readyState < 2) return;
  if (t - lastDetectMs < DETECT_EVERY_MS) return;
  if (video.currentTime === lastVideoTime) return;
  lastDetectMs = t;
  lastVideoTime = video.currentTime;

  const result = handLandmarker.detectForVideo(video, t);
  if (result.landmarks && result.landmarks.length > 0) {
    // Landmark 8 là đầu ngón trỏ.
    const lm = result.landmarks[0][8];
    const x = (1 - lm.x) * W;
    const y = lm.y * H;
    fingertip = { x, y };
    trail.push({ x, y });
    const maxTrail = IS_MOBILE ? TRAIL_LEN_MOBILE : TRAIL_LEN_PC;
    while (trail.length > maxTrail) trail.shift();
  } else {
    fingertip = null;
    trail = [];
  }
}

function gameLoop(t) {
  if (!running) return;
  const minFrameMs = 1000 / TARGET_FPS;
  if (t - lastFrameMs < minFrameMs) {
    requestAnimationFrame(gameLoop);
    return;
  }
  const dt = Math.min(42, t - lastFrameMs || 16.67);
  lastFrameMs = t;

  detectHand(t);

  ctx.save();
  drawCamera();

  if (shakeFrames > 0) {
    ctx.translate(rand(-9, 9), rand(-9, 9));
    shakeFrames--;
  }

  if (flashRed > 0) {
    ctx.fillStyle = `rgba(220,0,0,${flashRed / 20 * .34})`;
    ctx.fillRect(0, 0, W, H);
    flashRed--;
  }

  if (!paused && !gameOver) {
    maybeSpawn(t);
    const alive = [];
    for (const obj of objects) {
      const ok = obj.update(dt);
      if (ok) {
        if (obj.hitTest(trail)) {
          sliceObject(obj);
        } else {
          alive.push(obj);
        }
      } else {
        if (obj.missed && obj.type === 'fruit') {
          lives--;
          comboCount = 0;
          if (lives <= 0) endGame();
        }
      }
    }
    objects = alive;
  }

  particles = particles.filter(p => {
    const alive = paused ? p.life > 0 : p.update(dt);
    p.draw();
    return alive;
  });

  for (const obj of objects) obj.draw();
  drawTrail();
  drawFingertip();
  drawHUD();
  if (paused && !gameOver) drawPaused();
  if (gameOver) drawGameOver();

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

async function init() {
  if (initialized) return;
  initialized = true;
  startBtn.disabled = true;
  startBtn.textContent = 'Đang mở camera...';
  statusEl.textContent = 'Đang xin quyền camera...';

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Trình duyệt cần HTTPS hoặc localhost để mở camera.');
    }

    const constraints = {
      audio: false,
      video: {
        facingMode: 'user',
        width: { ideal: IS_MOBILE ? 960 : 1280 },
        height: { ideal: IS_MOBILE ? 540 : 720 },
        frameRate: { ideal: IS_MOBILE ? 30 : 60, max: IS_MOBILE ? 30 : 60 }
      }
    };

    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = 'Camera OK. Đang tải model MediaPipe...';
  } catch (e) {
    statusEl.textContent = '⚠️ ' + e.message;
    startBtn.disabled = false;
    startBtn.textContent = '▶ Start Game';
    initialized = false;
    return;
  }

  try {
    const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',
        // CPU ổn định hơn trên mobile; PC cũng đủ mượt với 1 tay + giới hạn FPS.
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numHands: 1,
      minHandDetectionConfidence: IS_MOBILE ? 0.50 : 0.56,
      minHandPresenceConfidence: IS_MOBILE ? 0.50 : 0.56,
      minTrackingConfidence: IS_MOBILE ? 0.46 : 0.52
    });
  } catch (e) {
    statusEl.textContent = 'Lỗi MediaPipe: ' + e.message;
    startBtn.disabled = false;
    startBtn.textContent = '▶ Start Game';
    initialized = false;
    return;
  }

  startOverlay.style.display = 'none';
  statusEl.textContent = IS_MOBILE ? 'Mobile mode: 30FPS, 1 tay, tối ưu GPU.' : 'PC mode: 60FPS, camera HD.';
  setTimeout(() => { if (statusEl.textContent) statusEl.textContent = ''; }, 2600);
  resetGame();
  running = true;
  lastFrameMs = performance.now();
  requestAnimationFrame(gameLoop);
}

startBtn.addEventListener('click', init);

// Vẽ màn hình chờ trước khi start
function idleDraw() {
  if (running) return;
  drawBackground();
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 ${clamp(W/16, 42, 88)}px Arial`;
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.fillText('🍉 Fruit Ninja', W/2, H/2 - 30);
  ctx.font = `600 ${clamp(W/60, 16, 24)}px Arial`;
  ctx.fillStyle = 'rgba(255,255,255,.68)';
  ctx.fillText('Bấm Start để mở camera', W/2, H/2 + 40);
  ctx.restore();
  requestAnimationFrame(idleDraw);
}
idleDraw();
</script>
