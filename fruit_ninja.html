<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fruit Ninja Camera - Optimized</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    user-select: none;
  }

  #container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #050510;
  }

  #webcam {
    display: none;
  }

  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #050510;
    cursor: none;
  }

  #status {
    position: fixed;
    left: 50%;
    bottom: calc(86px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 50;
    color: #ddd;
    font-size: 14px;
    text-align: center;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    max-width: 92vw;
  }

  #toolbar {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border-radius: 18px;
    background: rgba(0,0,0,0.38);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 28px rgba(0,0,0,0.45);
  }

  #toolbar button {
    border: none;
    outline: none;
    padding: 12px 16px;
    border-radius: 14px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #00bcd4, #0066ff);
    box-shadow: 0 5px 16px rgba(0,150,255,0.35);
    white-space: nowrap;
  }

  #toolbar button:active {
    transform: scale(0.95);
  }

  #toolbar button.secondary {
    background: linear-gradient(135deg, #555, #222);
  }

  #toolbar button.danger {
    background: linear-gradient(135deg, #ff3355, #aa0033);
  }

  @media (max-width: 700px) {
    #toolbar {
      gap: 6px;
      padding: 6px;
      bottom: calc(12px + env(safe-area-inset-bottom));
    }

    #toolbar button {
      padding: 10px 11px;
      font-size: 13px;
      border-radius: 12px;
    }

    #status {
      font-size: 12px;
      bottom: calc(74px + env(safe-area-inset-bottom));
    }
  }
</style>
</head>

<body>
<div id="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="status">Đang khởi động camera...</div>

<div id="toolbar">
  <button id="fullscreenBtn">⛶ Full</button>
  <button id="restartBtn" class="secondary">🔄 Restart</button>
  <button id="pauseBtn" class="secondary">⏸ Pause</button>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

// ============================================================
// DOM
// ============================================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });
const video = document.getElementById("webcam");
const statusEl = document.getElementById("status");

const fullscreenBtn = document.getElementById("fullscreenBtn");
const restartBtn = document.getElementById("restartBtn");
const pauseBtn = document.getElementById("pauseBtn");

// ============================================================
// Responsive canvas
// ============================================================
let W = 0;
let H = 0;
let DPR = 1;

function resizeGame() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  W = Math.floor(window.innerWidth);
  H = Math.floor(window.innerHeight);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resizeGame);
window.addEventListener("orientationchange", () => {
  setTimeout(resizeGame, 250);
});
document.addEventListener("fullscreenchange", () => {
  resizeGame();
  fullscreenBtn.textContent = document.fullscreenElement ? "❎ Exit" : "⛶ Full";
});

resizeGame();

// ============================================================
// Device config
// ============================================================
const isMobile =
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
  Math.min(window.innerWidth, window.innerHeight) < 760;

const MP_DELEGATE = isMobile ? "CPU" : "GPU";

const MAX_LIVES = 6;
const WIN_SCORE = 30;

const TRAIL_LEN = isMobile ? 12 : 22;
const BASE_INTERVAL = isMobile ? 1500 : 1250;
const MAX_FRUITS_ON_SCREEN = isMobile ? 5 : 9;
const PARTICLE_MULTIPLIER = isMobile ? 0.45 : 1;

// ============================================================
// Fruit definitions
// ============================================================
const FRUITS = [
  { name: "watermelon", label: "🍉", color: "#22aa22", inner: "#ff4466", r: 42 },
  { name: "orange",     label: "🍊", color: "#ff8800", inner: "#ffaa44", r: 32 },
  { name: "apple",      label: "🍎", color: "#cc2222", inner: "#ff6666", r: 30 },
  { name: "banana",     label: "🍌", color: "#ddcc00", inner: "#ffee44", r: 28 },
  { name: "strawberry", label: "🍓", color: "#cc2244", inner: "#ff6688", r: 24 },
  { name: "grape",      label: "🍇", color: "#882299", inner: "#bb55cc", r: 22 },
  { name: "bomb",       label: "💣", color: "#222222", inner: null,      r: 30 },
];

// ============================================================
// State
// ============================================================
let fruits = [];
let particles = [];
let trail = [];

let score = 0;
let lives = MAX_LIVES;
let gameOver = false;
let paused = false;

let lastSpawn = 0;
let flashRed = 0;
let shakeFrames = 0;

let comboCount = 0;
let comboTime = 0;

let fingerPoint = null;

let handLandmarker = null;
let lastVideoTime = -1;

let fps = 0;
let lastFpsTime = performance.now();
let frameCount = 0;

// ============================================================
// Utils
// ============================================================
function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function lighten(hex, amt) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);

  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function nowMs() {
  return performance.now();
}

// ============================================================
// Particle
// ============================================================
class Particle {
  constructor(x, y, color) {
    const a = Math.random() * Math.PI * 2;
    const s = rand(3, 9);

    this.x = x;
    this.y = y;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s - 3;
    this.color = color;
    this.life = 1;
    this.r = rand(2.5, 6);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.35;
    this.life -= 0.04;
    return this.life > 0;
  }

  draw() {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// Fruit
// ============================================================
class Fruit {
  constructor() {
    const info = FRUITS[Math.floor(Math.random() * FRUITS.length)];
    Object.assign(this, info);

    const scale = Math.max(0.78, Math.min(W, H) / 900);
    this.r = this.r * scale;

    this.x = this.r + 24 + Math.random() * Math.max(10, W - this.r * 2 - 48);
    this.y = H + this.r + 20;

    const centerPull = (W / 2 - this.x) / W;

    this.vx = centerPull * rand(3, 8) + rand(-2.5, 2.5);
    this.vy = -rand(H * 0.018, H * 0.026);

    this.rot = 0;
    this.rspd = rand(-7, 7);

    this.sliced = false;
    this.missed = false;
  }

  update() {
    this.vy += H * 0.00062;
    this.x += this.vx;
    this.y += this.vy;
    this.rot += this.rspd;

    if (this.x < -this.r * 2 || this.x > W + this.r * 2) {
      return false;
    }

    if (this.y > H + this.r + 80) {
      if (!this.sliced) this.missed = true;
      return false;
    }

    return true;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot * Math.PI / 180);

    // Shadow
    ctx.save();
    ctx.translate(0, this.r + 5);
    ctx.scale(1, 0.25);
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fill();
    ctx.restore();

    // Body
    const grad = ctx.createRadialGradient(
      -this.r * 0.35,
      -this.r * 0.35,
      1,
      0,
      0,
      this.r
    );

    grad.addColorStop(0, lighten(this.color, 70));
    grad.addColorStop(1, this.color);

    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Emoji
    ctx.font = `${this.r * 1.12}px serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(this.label, 0, 2);

    ctx.restore();
  }

  hitTest(points) {
    if (this.sliced || points.length < 2) return false;

    for (let i = 1; i < points.length; i++) {
      const x1 = points[i - 1].x;
      const y1 = points[i - 1].y;
      const x2 = points[i].x;
      const y2 = points[i].y;

      const dx = x2 - x1;
      const dy = y2 - y1;
      const len2 = dx * dx + dy * dy;

      if (len2 < 4) continue;

      const t = clamp(
        ((this.x - x1) * dx + (this.y - y1) * dy) / len2,
        0,
        1
      );

      const nx = x1 + t * dx;
      const ny = y1 + t * dy;

      const hitRadius = this.r * (isMobile ? 2.35 : 2.15);

      if (Math.hypot(this.x - nx, this.y - ny) < hitRadius) {
        return true;
      }
    }

    return false;
  }
}

// ============================================================
// Game logic
// ============================================================
function spawnInterval() {
  return Math.max(480, BASE_INTERVAL - score * 18);
}

function maybeSpawn(t) {
  if (gameOver || paused) return;
  if (fruits.length >= MAX_FRUITS_ON_SCREEN) return;

  if (t - lastSpawn > spawnInterval()) {
    const count = Math.random() < 0.22 && !isMobile ? 2 : 1;

    for (let i = 0; i < count; i++) {
      if (fruits.length < MAX_FRUITS_ON_SCREEN) {
        fruits.push(new Fruit());
      }
    }

    lastSpawn = t;
  }
}

function addParticles(f, amount, color) {
  const n = Math.floor(amount * PARTICLE_MULTIPLIER);
  for (let i = 0; i < n; i++) {
    particles.push(new Particle(f.x, f.y, color));
  }
}

function sliceFruit(f) {
  f.sliced = true;

  score++;
  comboCount++;
  comboTime = nowMs();

  addParticles(f, 22, f.color);

  if (f.inner) {
    addParticles(f, 12, f.inner);
  }
}

function hitBomb(f) {
  f.sliced = true;

  lives--;
  comboCount = 0;
  flashRed = 18;
  shakeFrames = isMobile ? 10 : 18;

  addParticles(f, 20, "#222");
  addParticles(f, 10, "#ff3333");

  if (lives <= 0) {
    endGame();
  }
}

function endGame() {
  gameOver = true;
}

function resetGame() {
  fruits = [];
  particles = [];
  trail = [];

  score = 0;
  lives = MAX_LIVES;
  gameOver = false;
  paused = false;

  flashRed = 0;
  shakeFrames = 0;
  comboCount = 0;
  fingerPoint = null;

  lastSpawn = nowMs();

  pauseBtn.textContent = "⏸ Pause";
  statusEl.textContent = "";
}

// ============================================================
// Drawing
// ============================================================
function drawCameraBackground() {
  if (video.readyState >= 2) {
    ctx.save();

    ctx.scale(-1, 1);

    const vw = video.videoWidth || 1280;
    const vh = video.videoHeight || 720;

    const scale = Math.max(W / vw, H / vh);
    const dw = vw * scale;
    const dh = vh * scale;
    const dx = -(W + (dw - W) / 2);
    const dy = -(dh - H) / 2;

    ctx.drawImage(video, dx, dy, dw, dh);

    ctx.restore();
  } else {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#101020");
    bg.addColorStop(1, "#050510");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.fillStyle = "rgba(0,0,18,0.43)";
  ctx.fillRect(0, 0, W, H);
}

function drawTrail() {
  if (trail.length < 2) return;

  for (let i = 1; i < trail.length; i++) {
    const t = i / trail.length;

    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);

    ctx.strokeStyle = `rgba(${80 + t * 120 | 0}, ${160 + t * 80 | 0}, 255, ${t * 0.95})`;
    ctx.lineWidth = Math.max(3, t * (isMobile ? 9 : 11));
    ctx.lineCap = "round";
    ctx.stroke();
  }
}

function drawFingerDot() {
  if (!fingerPoint) return;

  ctx.beginPath();
  ctx.arc(fingerPoint.x, fingerPoint.y, isMobile ? 20 : 22, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(fingerPoint.x, fingerPoint.y, isMobile ? 10 : 11, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(80,220,255,0.92)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(fingerPoint.x, fingerPoint.y, isMobile ? 4 : 5, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
}

function drawHUD() {
  const topPad = 22 + (window.visualViewport ? Math.max(0, window.innerHeight - window.visualViewport.height) : 0);

  // Score
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "top";

  const scoreFont = isMobile ? 30 : 46;
  ctx.font = `900 ${scoreFont}px Arial`;

  const scoreText = `SCORE ${score}`;

  ctx.lineWidth = isMobile ? 5 : 7;
  ctx.strokeStyle = "rgba(0,0,0,0.9)";
  ctx.strokeText(scoreText, 18, topPad);

  ctx.fillStyle = "#00ffc8";
  ctx.fillText(scoreText, 18, topPad);
  ctx.restore();

  // Lives
  ctx.save();
  ctx.textAlign = "right";
  ctx.textBaseline = "top";

  const heartFont = isMobile ? 25 : 34;
  ctx.font = `${heartFont}px serif`;

  const spacing = isMobile ? 27 : 38;
  const startX = W - 18;
  const y = topPad + 4;

  for (let i = 0; i < MAX_LIVES; i++) {
    ctx.fillStyle = i < lives ? "#ff3355" : "rgba(255,255,255,0.22)";
    ctx.fillText("♥", startX - i * spacing, y);
  }

  ctx.restore();

  // Combo
  if (comboCount >= 3 && nowMs() - comboTime < 900) {
    const age = (nowMs() - comboTime) / 900;

    ctx.save();
    ctx.globalAlpha = 1 - age;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `900 ${Math.max(28, (isMobile ? 44 : 64) - age * 14)}px Arial`;

    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 28;

    ctx.lineWidth = 7;
    ctx.strokeStyle = "#001018";
    ctx.strokeText(`COMBO ×${comboCount}!`, W / 2, H * 0.34);

    ctx.fillStyle = "#00eaff";
    ctx.fillText(`COMBO ×${comboCount}!`, W / 2, H * 0.34);

    ctx.restore();
  }

  // Small info
  ctx.save();
  ctx.font = `${isMobile ? 11 : 13}px Arial`;
  ctx.fillStyle = "rgba(255,255,255,0.48)";
  ctx.textAlign = "left";
  ctx.fillText(`${isMobile ? "Mobile CPU" : "PC " + MP_DELEGATE} | FPS ${fps}`, 12, H - 16);

  ctx.textAlign = "right";
  ctx.fillText("Made by Dang Duc Minh", W - 12, H - 16);
  ctx.restore();
}

function drawPauseOverlay() {
  ctx.save();

  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `900 ${isMobile ? 48 : 72}px Arial`;

  ctx.lineWidth = 8;
  ctx.strokeStyle = "#000";
  ctx.strokeText("PAUSED", W / 2, H / 2 - 20);

  ctx.fillStyle = "#ffffff";
  ctx.fillText("PAUSED", W / 2, H / 2 - 20);

  ctx.font = `${isMobile ? 18 : 24}px Arial`;
  ctx.fillStyle = "#cccccc";
  ctx.fillText("Nhấn P hoặc nút Resume để chơi tiếp", W / 2, H / 2 + 44);

  ctx.restore();
}

function drawGameOver() {
  const win = score >= WIN_SCORE;

  ctx.save();

  ctx.fillStyle = "rgba(0,0,0,0.62)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = `900 ${isMobile ? 48 : 76}px Arial`;
  ctx.lineWidth = 8;
  ctx.strokeStyle = "#000";
  ctx.strokeText(win ? "🏆 YOU WIN!" : "💀 GAME OVER", W / 2, H / 2 - 52);

  ctx.fillStyle = win ? "#00ff88" : "#ff3355";
  ctx.fillText(win ? "🏆 YOU WIN!" : "💀 GAME OVER", W / 2, H / 2 - 52);

  ctx.font = `800 ${isMobile ? 28 : 38}px Arial`;
  ctx.fillStyle = "#ffffff";
  ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 14);

  ctx.font = `${isMobile ? 17 : 23}px Arial`;
  ctx.fillStyle = "#cccccc";
  ctx.fillText("Nhấn R để chơi lại", W / 2, H / 2 + 62);

  ctx.restore();
}

// ============================================================
// Hand detection
// ============================================================
function updateHand(now) {
  if (!handLandmarker) return;

  if (video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;

  lastVideoTime = video.currentTime;

  const result = handLandmarker.detectForVideo(video, now);

  if (result.landmarks && result.landmarks.length > 0) {
    // Landmark 8 = đầu ngón trỏ
    const lm = result.landmarks[0][8];

    const x = (1 - lm.x) * W;
    const y = lm.y * H;

    fingerPoint = { x, y };

    trail.push({ x, y });

    if (trail.length > TRAIL_LEN) {
      trail.shift();
    }
  } else {
    fingerPoint = null;
    trail = [];
  }
}

// ============================================================
// Main loop
// ============================================================
function gameLoop(now) {
  frameCount++;

  if (now - lastFpsTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }

  updateHand(now);

  ctx.save();

  if (shakeFrames > 0) {
    const power = isMobile ? 8 : 14;
    const dx = (Math.random() - 0.5) * power;
    const dy = (Math.random() - 0.5) * power;
    ctx.translate(dx, dy);
    shakeFrames--;
  }

  drawCameraBackground();

  if (flashRed > 0) {
    ctx.fillStyle = `rgba(220,0,0,${flashRed / 18 * 0.42})`;
    ctx.fillRect(0, 0, W, H);
    flashRed--;
  }

  if (!paused && !gameOver) {
    maybeSpawn(now);

    const alive = [];

    for (const f of fruits) {
      const ok = f.update();

      if (ok) {
        if (f.hitTest(trail)) {
          if (f.name === "bomb") {
            hitBomb(f);
          } else {
            sliceFruit(f);
          }
        } else {
          alive.push(f);
        }
      } else {
        if (f.missed && f.name !== "bomb") {
          lives--;
          comboCount = 0;

          if (lives <= 0) {
            endGame();
          }
        }
      }
    }

    fruits = alive;

    if (score >= WIN_SCORE) {
      endGame();
    }
  }

  // Particles
  particles = particles.filter(p => {
    const alive = paused ? true : p.update();
    p.draw();
    return alive && p.life > 0;
  });

  // Fruits
  for (const f of fruits) {
    f.draw();
  }

  drawTrail();
  drawFingerDot();
  drawHUD();

  if (paused && !gameOver) {
    drawPauseOverlay();
  }

  if (gameOver) {
    drawGameOver();
  }

  ctx.restore();

  requestAnimationFrame(gameLoop);
}

// ============================================================
// Controls
// ============================================================
async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
      fullscreenBtn.textContent = "❎ Exit";
    } else {
      await document.exitFullscreen();
      fullscreenBtn.textContent = "⛶ Full";
    }
  } catch (e) {
    console.error(e);
  }
}

function togglePause() {
  if (gameOver) return;

  paused = !paused;
  pauseBtn.textContent = paused ? "▶ Resume" : "⏸ Pause";
}

fullscreenBtn.addEventListener("click", toggleFullscreen);
restartBtn.addEventListener("click", resetGame);
pauseBtn.addEventListener("click", togglePause);

document.addEventListener("keydown", e => {
  if (e.key === "f" || e.key === "F") {
    toggleFullscreen();
  }

  if (e.key === "r" || e.key === "R") {
    resetGame();
  }

  if (e.key === "p" || e.key === "P") {
    togglePause();
  }

  if (e.key === "q" || e.key === "Q" || e.key === "Escape") {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    }
  }
});

// Prevent mobile scroll / zoom gesture issue
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

// ============================================================
// Init
// ============================================================
async function setupCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Camera cần chạy trên HTTPS hoặc localhost.");
  }

  const cameraConfig = isMobile
    ? {
        video: {
          width: { ideal: 1280 },
          height: { ideal: 720 },
          facingMode: "user"
        },
        audio: false
      }
    : {
        video: {
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          facingMode: "user"
        },
        audio: false
      };

  const stream = await navigator.mediaDevices.getUserMedia(cameraConfig);

  video.srcObject = stream;
  await video.play();
}

async function createHandLandmarker(delegateName) {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  return await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
      delegate: delegateName
    },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: isMobile ? 0.5 : 0.58,
    minHandPresenceConfidence: isMobile ? 0.5 : 0.58,
    minTrackingConfidence: isMobile ? 0.45 : 0.52
  });
}

async function init() {
  try {
    statusEl.textContent = "Đang mở camera...";
    await setupCamera();

    statusEl.textContent = `Camera OK. Đang tải MediaPipe bằng ${MP_DELEGATE}...`;

    try {
      handLandmarker = await createHandLandmarker(MP_DELEGATE);
    } catch (gpuError) {
      console.warn("Delegate failed, fallback CPU:", gpuError);

      statusEl.textContent = "GPU lỗi hoặc không hỗ trợ. Đang fallback CPU...";
      handLandmarker = await createHandLandmarker("CPU");
    }

    statusEl.textContent = "";
    lastSpawn = nowMs();

    requestAnimationFrame(gameLoop);
  } catch (e) {
    console.error(e);
    statusEl.textContent = "⚠️ " + e.message;
  }
}

init();
</script>
