<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fruit Ninja Camera - Optimized</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050510;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }

  #container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #050510;
  }

  #webcam {
    display: none;
  }

  #canvas {
    width: 100vw;
    height: 100vh;
    display: block;
    cursor: none;
    background: #050510;
  }

  #toolbar {
    position: fixed;
    left: 10px;
    top: max(10px, env(safe-area-inset-top));
    z-index: 9999;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  #toolbar button {
    border: none;
    border-radius: 10px;
    padding: 8px 10px;
    background: rgba(0, 188, 212, 0.88);
    color: white;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    backdrop-filter: blur(8px);
  }

  #toolbar button:active {
    transform: scale(0.95);
  }

  #status {
    position: fixed;
    left: 50%;
    bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    color: #ddd;
    font-size: 13px;
    z-index: 9999;
    background: rgba(0,0,0,.45);
    padding: 8px 12px;
    border-radius: 999px;
    text-align: center;
    max-width: 92vw;
    backdrop-filter: blur(8px);
  }

  @media (min-width: 900px) {
    #toolbar {
      left: 16px;
      top: 16px;
      gap: 8px;
    }

    #toolbar button {
      font-size: 14px;
      padding: 10px 14px;
    }

    #status {
      font-size: 14px;
    }
  }
</style>
</head>

<body>
<div id="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="toolbar">
  <button id="fullscreenBtn">⛶ Full</button>
  <button id="restartBtn">↻ Restart</button>
  <button id="pauseBtn">⏸ Pause</button>
</div>

<div id="status">Đang khởi động camera...</div>

<script type="module">
import {
  FilesetResolver,
  HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

/* =========================
   DOM
========================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });

const video = document.getElementById("webcam");
const statusEl = document.getElementById("status");

const fullscreenBtn = document.getElementById("fullscreenBtn");
const restartBtn = document.getElementById("restartBtn");
const pauseBtn = document.getElementById("pauseBtn");

/* =========================
   Device config
========================= */
const IS_MOBILE =
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
  window.innerWidth < 900;

const DPR_LIMIT = IS_MOBILE ? 1.35 : 1.75;
let DPR = Math.min(window.devicePixelRatio || 1, DPR_LIMIT);

let W = 0;
let H = 0;

/* Mobile detect thấp hơn để đỡ lag */
const DETECT_INTERVAL = IS_MOBILE ? 55 : 28;

/* Số tay: mobile nên 1 cho nhẹ */
const NUM_HANDS = IS_MOBILE ? 1 : 2;

/* =========================
   Game config
========================= */
const MAX_LIVES = 5;
const WIN_SCORE = 40;

const TRAIL_LEN = IS_MOBILE ? 14 : 22;
const BASE_INTERVAL = IS_MOBILE ? 1200 : 950;

const FRUITS = [
  { name: "watermelon", label: "🍉", color: "#22aa22", inner: "#ff4466", r: 42 },
  { name: "orange",     label: "🍊", color: "#ff8800", inner: "#ffaa44", r: 34 },
  { name: "apple",      label: "🍎", color: "#cc2222", inner: "#ff6666", r: 32 },
  { name: "banana",     label: "🍌", color: "#ddcc00", inner: "#ffee44", r: 30 },
  { name: "strawberry", label: "🍓", color: "#cc2244", inner: "#ff6688", r: 28 },
  { name: "grape",      label: "🍇", color: "#882299", inner: "#bb55cc", r: 27 },
  { name: "bomb",       label: "💣", color: "#222222", inner: null,      r: 31 },
];

/* =========================
   State
========================= */
let fruits = [];
let particles = [];
let trail = [];

let score = 0;
let lives = MAX_LIVES;
let gameOver = false;
let paused = false;

let lastSpawn = 0;
let lastDetectAt = 0;
let lastVideoTime = -1;

let flashRed = 0;
let shakeFrames = 0;

let comboCount = 0;
let comboTime = 0;

let pointer = null;
let handLandmarker = null;

let usingHand = false;
let delegateUsed = "GPU";

/* =========================
   Resize
========================= */
function resizeGame() {
  DPR = Math.min(window.devicePixelRatio || 1, DPR_LIMIT);

  W = Math.floor(window.innerWidth);
  H = Math.floor(window.innerHeight);

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resizeGame);
window.addEventListener("orientationchange", () => {
  setTimeout(resizeGame, 250);
});
document.addEventListener("fullscreenchange", resizeGame);

resizeGame();

/* =========================
   Utility
========================= */
function rand(min, max) {
  return min + Math.random() * (max - min);
}

function lighten(hex, amt) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);

  return `rgb(${Math.min(255, r + amt)}, ${Math.min(255, g + amt)}, ${Math.min(255, b + amt)})`;
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

/* =========================
   Particle
========================= */
class Particle {
  constructor(x, y, color) {
    const a = Math.random() * Math.PI * 2;
    const s = rand(3, 9);

    this.x = x;
    this.y = y;
    this.vx = Math.cos(a) * s;
    this.vy = Math.sin(a) * s - 3;
    this.color = color;
    this.life = 1;
    this.r = rand(3, 7);
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.34;
    this.life -= 0.035;
    return this.life > 0;
  }

  draw() {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* =========================
   Fruit
========================= */
class Fruit {
  constructor() {
    const info = FRUITS[Math.floor(Math.random() * FRUITS.length)];
    Object.assign(this, info);

    const screenScale = clamp(Math.min(W, H) / 700, 0.8, 1.35);
    this.r = this.r * screenScale;

    this.x = rand(this.r + 30, W - this.r - 30);
    this.y = H + this.r + rand(20, 80);

    this.vx = rand(-3.8, 3.8) * screenScale;

    /* Bay cao hơn bản cũ */
    const powerBase = IS_MOBILE ? 15.5 : 17.5;
    const powerExtra = Math.min(H / 260, 5);
    this.vy = -rand(powerBase, powerBase + powerExtra);

    this.gravity = IS_MOBILE ? 0.34 : 0.36;

    this.rot = 0;
    this.rspd = rand(-7, 7);
    this.sliced = false;
    this.missed = false;
  }

  update() {
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.rot += this.rspd;

    if (this.x < this.r) {
      this.x = this.r;
      this.vx *= -0.75;
    }

    if (this.x > W - this.r) {
      this.x = W - this.r;
      this.vx *= -0.75;
    }

    if (this.y > H + this.r + 90) {
      if (!this.sliced) this.missed = true;
      return false;
    }

    return true;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot * Math.PI / 180);

    ctx.save();
    ctx.translate(0, this.r + 4);
    ctx.scale(1, 0.23);
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.38)";
    ctx.fill();
    ctx.restore();

    const grad = ctx.createRadialGradient(
      -this.r * 0.35,
      -this.r * 0.35,
      1,
      0,
      0,
      this.r
    );

    grad.addColorStop(0, lighten(this.color, 70));
    grad.addColorStop(1, this.color);

    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.42)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.font = `${this.r * 1.12}px serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(this.label, 0, 1);

    ctx.restore();
  }

  hitTest(path) {
    if (this.sliced || path.length < 2) return false;

    for (let i = 1; i < path.length; i++) {
      const x1 = path[i - 1].x;
      const y1 = path[i - 1].y;
      const x2 = path[i].x;
      const y2 = path[i].y;

      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;

      if (lenSq < 4) continue;

      const t = clamp(
        ((this.x - x1) * dx + (this.y - y1) * dy) / lenSq,
        0,
        1
      );

      const nx = x1 + t * dx;
      const ny = y1 + t * dy;

      const hitRadius = this.r * (IS_MOBILE ? 1.7 : 1.55);

      if (Math.hypot(this.x - nx, this.y - ny) < hitRadius) {
        return true;
      }
    }

    return false;
  }
}

/* =========================
   Spawn
========================= */
function spawnInterval() {
  const difficulty = score * (IS_MOBILE ? 10 : 14);
  return Math.max(IS_MOBILE ? 650 : 430, BASE_INTERVAL - difficulty);
}

function maxFruitsOnScreen() {
  if (IS_MOBILE) return 5;
  if (W >= 1800) return 9;
  return 7;
}

function maybeSpawn(now) {
  if (fruits.length >= maxFruitsOnScreen()) return;

  if (now - lastSpawn > spawnInterval()) {
    const count =
      score > 25 && !IS_MOBILE ? Math.floor(rand(1, 4)) :
      score > 15 ? Math.floor(rand(1, 3)) :
      1;

    for (let i = 0; i < count; i++) {
      if (fruits.length < maxFruitsOnScreen()) {
        fruits.push(new Fruit());
      }
    }

    lastSpawn = now;
  }
}

/* =========================
   Slice logic
========================= */
function sliceFruit(f) {
  f.sliced = true;
  score++;

  comboCount++;
  comboTime = performance.now();

  for (let i = 0; i < 18; i++) {
    particles.push(new Particle(f.x, f.y, f.color));
  }

  if (f.inner) {
    for (let i = 0; i < 9; i++) {
      particles.push(new Particle(f.x, f.y, f.inner));
    }
  }
}

function hitBomb(f) {
  f.sliced = true;

  lives--;
  comboCount = 0;
  flashRed = 18;
  shakeFrames = IS_MOBILE ? 12 : 18;

  for (let i = 0; i < 22; i++) {
    particles.push(new Particle(f.x, f.y, "#333333"));
  }

  if (lives <= 0) {
    endGame();
  }
}

function endGame() {
  gameOver = true;
}

/* =========================
   Draw
========================= */
function drawVideoBackground() {
  if (video.readyState >= 2) {
    ctx.save();

    ctx.scale(-1, 1);
    ctx.drawImage(video, -W, 0, W, H);

    ctx.restore();

    ctx.fillStyle = "rgba(0,0,20,0.48)";
    ctx.fillRect(0, 0, W, H);
  } else {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#101028");
    bg.addColorStop(1, "#050510");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawTrail() {
  if (trail.length < 2) return;

  for (let i = 1; i < trail.length; i++) {
    const t = i / trail.length;

    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);

    ctx.strokeStyle = `rgba(${80 + t * 120 | 0}, ${160 + t * 80 | 0}, 255, ${t * 0.9})`;
    ctx.lineWidth = Math.max(3, t * (IS_MOBILE ? 8 : 10));
    ctx.lineCap = "round";
    ctx.stroke();
  }
}

function drawPointerDot() {
  if (!pointer) return;

  ctx.beginPath();
  ctx.arc(pointer.x, pointer.y, IS_MOBILE ? 16 : 18, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(pointer.x, pointer.y, IS_MOBILE ? 8 : 10, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(80,220,255,0.9)";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(pointer.x, pointer.y, IS_MOBILE ? 3 : 4, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
}

function drawHUD() {
  const safeTop = IS_MOBILE ? 58 : 70;

  ctx.save();

  ctx.textBaseline = "top";

  /* Score */
  ctx.font = `900 ${IS_MOBILE ? 24 : 34}px Arial`;
  ctx.lineWidth = 5;
  ctx.strokeStyle = "rgba(0,0,0,.85)";
  ctx.fillStyle = "#00ffbb";
  ctx.strokeText(`SCORE ${score}`, 14, safeTop);
  ctx.fillText(`SCORE ${score}`, 14, safeTop);

  /* Lives nằm góc phải, không bị button che */
  ctx.font = `${IS_MOBILE ? 24 : 32}px serif`;
  ctx.textAlign = "right";

  for (let i = 0; i < MAX_LIVES; i++) {
    ctx.fillStyle = i < lives ? "#ff3355" : "rgba(255,255,255,.22)";
    ctx.fillText("♥", W - 16 - i * (IS_MOBILE ? 28 : 38), IS_MOBILE ? 18 : 24);
  }

  /* Combo */
  if (comboCount >= 3 && performance.now() - comboTime < 850) {
    const age = (performance.now() - comboTime) / 850;

    ctx.globalAlpha = 1 - age;
    ctx.textAlign = "center";
    ctx.font = `900 ${IS_MOBILE ? 34 - age * 8 : 52 - age * 12}px Arial`;
    ctx.fillStyle = "#00eeff";
    ctx.shadowColor = "#00eeff";
    ctx.shadowBlur = 20;

    ctx.fillText(`COMBO x${comboCount}!`, W / 2, H / 2 - 90);

    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  /* Footer */
  ctx.textAlign = "left";
  ctx.font = `${IS_MOBILE ? 11 : 13}px Arial`;
  ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.fillText(
    IS_MOBILE ? "Touch/move hand để chém" : "F: Fullscreen | R: Restart | Space: Pause",
    10,
    H - 22
  );

  ctx.textAlign = "right";
  ctx.fillText("Made by Dang Duc Minh", W - 10, H - 22);

  ctx.restore();
}

function drawGameOver() {
  ctx.save();

  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0, 0, W, H);

  const win = score >= WIN_SCORE;

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = `900 ${IS_MOBILE ? 48 : 76}px Arial`;
  ctx.fillStyle = win ? "#00ff88" : "#ff3355";
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 8;

  const title = win ? "🏆 YOU WIN!" : "💀 GAME OVER";
  ctx.strokeText(title, W / 2, H / 2 - 48);
  ctx.fillText(title, W / 2, H / 2 - 48);

  ctx.font = `900 ${IS_MOBILE ? 26 : 36}px Arial`;
  ctx.fillStyle = "#ffffff";
  ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 18);

  ctx.font = `${IS_MOBILE ? 17 : 23}px Arial`;
  ctx.fillStyle = "#cccccc";
  ctx.fillText("Nhấn Restart hoặc phím R để chơi lại", W / 2, H / 2 + 70);

  ctx.restore();
}

/* =========================
   Hand detection
========================= */
function updateTrailFromPoint(x, y) {
  pointer = { x, y };

  trail.push({ x, y });

  while (trail.length > TRAIL_LEN) {
    trail.shift();
  }
}

function clearTrailSoft() {
  if (trail.length > 0) {
    trail.shift();
  } else {
    pointer = null;
  }
}

function detectHand(now) {
  if (!handLandmarker || video.readyState < 2) return;

  if (now - lastDetectAt < DETECT_INTERVAL) return;
  lastDetectAt = now;

  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  try {
    const result = handLandmarker.detectForVideo(video, now);

    if (result.landmarks && result.landmarks.length > 0) {
      usingHand = true;

      const lm = result.landmarks[0];

      /* landmark 8 = đầu ngón trỏ */
      const x = (1 - lm[8].x) * W;
      const y = lm[8].y * H;

      updateTrailFromPoint(x, y);
    } else {
      usingHand = false;
      clearTrailSoft();
    }
  } catch (e) {
    console.warn(e);
  }
}

/* =========================
   Main loop
========================= */
function gameLoop(now) {
  if (paused) {
    drawVideoBackground();
    drawHUD();

    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,.48)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `900 ${IS_MOBILE ? 48 : 72}px Arial`;
    ctx.fillStyle = "#ffffff";
    ctx.fillText("PAUSED", W / 2, H / 2);

    ctx.restore();

    requestAnimationFrame(gameLoop);
    return;
  }

  detectHand(now);

  ctx.save();

  if (shakeFrames > 0) {
    const power = IS_MOBILE ? 8 : 13;
    ctx.translate(rand(-power, power), rand(-power, power));
    shakeFrames--;
  }

  drawVideoBackground();

  if (flashRed > 0) {
    ctx.fillStyle = `rgba(220,0,0,${flashRed / 18 * 0.38})`;
    ctx.fillRect(0, 0, W, H);
    flashRed--;
  }

  if (!gameOver) {
    maybeSpawn(now);

    const alive = [];

    for (const f of fruits) {
      const ok = f.update();

      if (ok) {
        if (f.hitTest(trail)) {
          if (f.name === "bomb") {
            hitBomb(f);
          } else {
            sliceFruit(f);
          }
        } else {
          alive.push(f);
        }
      } else {
        if (f.missed && f.name !== "bomb") {
          lives--;
          comboCount = 0;

          if (lives <= 0) {
            endGame();
          }
        }
      }
    }

    fruits = alive;

    if (score >= WIN_SCORE) {
      endGame();
    }
  }

  particles = particles.filter(p => {
    p.update();
    p.draw();
    return p.life > 0;
  });

  for (const f of fruits) {
    f.draw();
  }

  drawTrail();
  drawPointerDot();
  drawHUD();

  if (gameOver) {
    drawGameOver();
  }

  ctx.restore();

  requestAnimationFrame(gameLoop);
}

/* =========================
   Reset
========================= */
function resetGame() {
  fruits = [];
  particles = [];
  trail = [];

  score = 0;
  lives = MAX_LIVES;
  gameOver = false;
  paused = false;

  flashRed = 0;
  shakeFrames = 0;
  comboCount = 0;
  comboTime = 0;

  pointer = null;
  lastSpawn = performance.now();

  pauseBtn.textContent = "⏸ Pause";
}

/* =========================
   Buttons
========================= */
fullscreenBtn.onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
      fullscreenBtn.textContent = "❎ Exit";
    } else {
      await document.exitFullscreen();
      fullscreenBtn.textContent = "⛶ Full";
    }
  } catch (e) {
    console.warn(e);
  }
};

restartBtn.onclick = () => {
  resetGame();
};

pauseBtn.onclick = () => {
  paused = !paused;
  pauseBtn.textContent = paused ? "▶ Resume" : "⏸ Pause";
};

/* =========================
   Keyboard
========================= */
document.addEventListener("keydown", async e => {
  if (e.key === "r" || e.key === "R") {
    resetGame();
  }

  if (e.key === " " || e.key === "p" || e.key === "P") {
    paused = !paused;
    pauseBtn.textContent = paused ? "▶ Resume" : "⏸ Pause";
  }

  if (e.key === "f" || e.key === "F") {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
        fullscreenBtn.textContent = "❎ Exit";
      } else {
        await document.exitFullscreen();
        fullscreenBtn.textContent = "⛶ Full";
      }
    } catch (err) {
      console.warn(err);
    }
  }

  if (e.key === "q" || e.key === "Q" || e.key === "Escape") {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    }
  }
});

/* =========================
   Mouse / touch fallback
========================= */
canvas.addEventListener("pointermove", e => {
  if (usingHand) return;

  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  updateTrailFromPoint(x, y);
});

canvas.addEventListener("pointerdown", e => {
  if (usingHand) return;

  const rect = canvas.getBoundingClientRect();
  updateTrailFromPoint(e.clientX - rect.left, e.clientY - rect.top);
});

canvas.addEventListener("pointerup", () => {
  if (!usingHand) {
    trail = [];
    pointer = null;
  }
});

/* =========================
   Init camera
========================= */
async function initCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Trình duyệt không hỗ trợ camera hoặc cần mở bằng HTTPS/local server.");
  }

  const videoConfig = IS_MOBILE
    ? {
        width: { ideal: 960 },
        height: { ideal: 540 },
        facingMode: "user"
      }
    : {
        width: { ideal: 1280 },
        height: { ideal: 720 },
        facingMode: "user"
      };

  const stream = await navigator.mediaDevices.getUserMedia({
    video: videoConfig,
    audio: false
  });

  video.srcObject = stream;
  await video.play();
}

/* =========================
   Init MediaPipe
========================= */
async function createHandLandmarkerWithDelegate(vision, delegate) {
  return await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
      delegate
    },
    runningMode: "VIDEO",
    numHands: NUM_HANDS,
    minHandDetectionConfidence: IS_MOBILE ? 0.55 : 0.5,
    minHandPresenceConfidence: IS_MOBILE ? 0.55 : 0.5,
    minTrackingConfidence: IS_MOBILE ? 0.5 : 0.45
  });
}

async function initMediaPipe() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  try {
    delegateUsed = "GPU";
    return await createHandLandmarkerWithDelegate(vision, "GPU");
  } catch (gpuError) {
    console.warn("GPU failed, fallback CPU", gpuError);

    delegateUsed = "CPU";
    return await createHandLandmarkerWithDelegate(vision, "CPU");
  }
}

/* =========================
   Start
========================= */
async function init() {
  try {
    resizeGame();

    statusEl.textContent = "Đang mở camera...";
    await initCamera();

    statusEl.textContent = "Camera OK. Đang tải MediaPipe...";
    handLandmarker = await initMediaPipe();

    statusEl.textContent =
      IS_MOBILE
        ? `Mobile mode: ${delegateUsed}, detect nhẹ hơn để giảm lag`
        : `PC mode: ${delegateUsed}, ready`;

    setTimeout(() => {
      statusEl.style.display = "none";
    }, 2200);

    lastSpawn = performance.now();
    requestAnimationFrame(gameLoop);
  } catch (e) {
    console.error(e);
    statusEl.textContent = "⚠️ " + e.message;
  }
}

init();
</script>
