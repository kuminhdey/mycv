<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Fruit Ninja Camera - PC & Mobile</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#050510; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; touch-action:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center; }
  #container { position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; background:#050510; }
  #webcam { display:none; }
  #canvas { width:100vw; height:100vh; display:block; cursor:none; background:#050510; }

  #toolbar {
    position:fixed;
    top:calc(12px + env(safe-area-inset-top));
    right:calc(12px + env(safe-area-inset-right));
    z-index:9999;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
    max-width:min(92vw, 520px);
  }
  .ui-btn {
    border:none;
    border-radius:999px;
    padding:10px 14px;
    background:rgba(0,188,212,.92);
    color:#fff;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(0,188,212,.25), inset 0 1px 0 rgba(255,255,255,.28);
    backdrop-filter:blur(8px);
  }
  .ui-btn:active { transform:scale(.96); }
  #pauseBtn.paused { background:rgba(255,152,0,.95); }

  #status {
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:9999;
    max-width:92vw;
    padding:8px 12px;
    color:#d8f7ff;
    background:rgba(0,0,0,.48);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    font-size:13px;
    text-align:center;
    backdrop-filter:blur(8px);
    pointer-events:none;
  }

  #startOverlay {
    position:fixed;
    inset:0;
    z-index:10000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:radial-gradient(circle at top, rgba(0,188,212,.18), rgba(0,0,0,.78) 55%, rgba(0,0,0,.92));
    color:#fff;
    text-align:center;
  }
  #startCard {
    width:min(520px, 94vw);
    padding:26px 22px;
    border-radius:28px;
    background:rgba(8,12,24,.72);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 24px 80px rgba(0,0,0,.45);
    backdrop-filter:blur(14px);
  }
  #startCard h1 { font-size:clamp(30px, 7vw, 54px); line-height:1.05; margin-bottom:10px; }
  #startCard p { color:#b8c9d6; line-height:1.5; margin:8px 0; font-size:15px; }
  #startBtn {
    margin-top:18px;
    width:100%;
    border:none;
    border-radius:18px;
    padding:15px 18px;
    background:linear-gradient(135deg, #00e5ff, #00ff88);
    color:#001016;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 12px 32px rgba(0,229,255,.25);
  }
  #smallHint { margin-top:12px; font-size:12px !important; color:#789 !important; }

  @media (max-width: 700px) {
    #toolbar { top:calc(8px + env(safe-area-inset-top)); right:8px; gap:6px; }
    .ui-btn { padding:9px 11px; font-size:12px; }
    #status { font-size:12px; bottom:calc(10px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div id="toolbar">
  <button class="ui-btn" id="fullscreenBtn">⛶ Full</button>
  <button class="ui-btn" id="restartBtn">🔄 Restart</button>
  <button class="ui-btn" id="pauseBtn">⏸ Pause</button>
  <button class="ui-btn" id="cameraBtn">🔁 Cam</button>
</div>

<div id="status">Nhấn Start để bật camera</div>

<div id="startOverlay">
  <div id="startCard">
    <h1>🍉 Fruit Ninja</h1>
    <p>Dùng đầu ngón tay trỏ để chém trái cây qua camera.</p>
    <p>PC: phím <b>F</b> Fullscreen, <b>R</b> Restart, <b>P</b> Pause. Mobile: xoay ngang để chơi rộng hơn.</p>
    <button id="startBtn">▶ Start Game</button>
    <p id="smallHint">Cần mở bằng HTTPS hoặc localhost để dùng camera.</p>
  </div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const video = document.getElementById('webcam');
const statusEl = document.getElementById('status');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');
const cameraBtn = document.getElementById('cameraBtn');

let W = 0, H = 0, DPR = 1;
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const prefersLowPower = isMobile || Math.min(screen.width, screen.height) < 800;

const FRUITS = [
  { name:'watermelon', label:'🍉', color:'#22aa22', inner:'#ff4466', r:42, score:1 },
  { name:'orange', label:'🍊', color:'#ff8800', inner:'#ffaa44', r:32, score:1 },
  { name:'apple', label:'🍎', color:'#cc2222', inner:'#ff6666', r:30, score:1 },
  { name:'banana', label:'🍌', color:'#ddcc00', inner:'#ffee44', r:29, score:1 },
  { name:'strawberry', label:'🍓', color:'#cc2244', inner:'#ff6688', r:25, score:1 },
  { name:'grape', label:'🍇', color:'#882299', inner:'#bb55cc', r:24, score:1 },
  { name:'special', label:'⭐', color:'#00d5ff', inner:'#fff070', r:30, score:3 },
  { name:'bomb', label:'💣', color:'#222222', inner:null, r:30, score:0 },
];

const MAX_LIVES = 6;
const WIN_SCORE = 50;
const TRAIL_LEN = prefersLowPower ? 15 : 24;
const BASE_INTERVAL = prefersLowPower ? 1500 : 1150;
const DETECT_EVERY_MS = prefersLowPower ? 70 : 34;

let fruits = [];
let particles = [];
let trail = [];
let score = 0;
let highScore = Number(localStorage.getItem('fruitNinjaHighScore') || 0);
let lives = MAX_LIVES;
let gameOver = false;
let paused = false;
let lastSpawn = 0;
let flashRed = 0;
let shakeFrames = 0;
let comboCount = 0;
let comboTime = 0;
let pointer = null;
let handLandmarker = null;
let lastVideoTime = -1;
let lastDetectMs = 0;
let cameraFacing = 'user';
let rafStarted = false;
let activeStream = null;

function resizeGame() {
  DPR = Math.min(window.devicePixelRatio || 1, prefersLowPower ? 1.5 : 2);
  W = Math.max(320, Math.floor(window.innerWidth));
  H = Math.max(320, Math.floor(window.innerHeight));
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resizeGame();
window.addEventListener('resize', resizeGame, { passive:true });
document.addEventListener('fullscreenchange', () => {
  fullscreenBtn.textContent = document.fullscreenElement ? '❎ Exit' : '⛶ Full';
  resizeGame();
});

function scaleUnit() { return Math.max(0.78, Math.min(1.35, Math.min(W, H) / 720)); }
function lighten(hex, amt) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}
function rand(min, max) { return min + Math.random() * (max - min); }

class Particle {
  constructor(x, y, color) {
    const a = Math.random() * Math.PI * 2;
    const s = rand(2, prefersLowPower ? 6 : 9) * scaleUnit();
    this.x = x; this.y = y;
    this.vx = Math.cos(a)*s;
    this.vy = Math.sin(a)*s - 2.7 * scaleUnit();
    this.color = color;
    this.life = 1;
    this.r = rand(2, 5) * scaleUnit();
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.30 * scaleUnit();
    this.life -= prefersLowPower ? 0.055 : 0.035;
    return this.life > 0;
  }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Fruit {
  constructor() {
    let pool = FRUITS;
    const info = pool[Math.floor(Math.random() * pool.length)];
    Object.assign(this, info);
    const s = scaleUnit();
    this.r = info.r * s;
    this.x = this.r + 24 + Math.random() * Math.max(10, W - this.r*2 - 48);
    this.y = H + this.r + rand(0, 80);
    this.vx = rand(-3.2, 3.2) * s;
    const heightBoost = H > W ? 1.05 : 1;
    this.vy = -rand(11.5, 17.8) * s * heightBoost;
    this.rot = 0;
    this.rspd = rand(-7, 7);
    this.sliced = false;
    this.missed = false;
  }
  update() {
    this.vy += 0.36 * scaleUnit();
    this.x += this.vx;
    this.y += this.vy;
    this.rot += this.rspd;
    if (this.x < this.r || this.x > W - this.r) this.vx *= -0.75;
    if (this.y > H + this.r + 80) {
      if (!this.sliced) this.missed = true;
      return false;
    }
    return true;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot * Math.PI/180);
    ctx.save();
    ctx.translate(0, this.r+4);
    ctx.scale(1, 0.25);
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.fill();
    ctx.restore();
    const grad = ctx.createRadialGradient(-this.r*.35, -this.r*.35, 1, 0, 0, this.r);
    grad.addColorStop(0, lighten(this.color, this.name === 'bomb' ? 45 : 70));
    grad.addColorStop(1, this.color);
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.42)';
    ctx.lineWidth = Math.max(1.5, this.r * .055);
    ctx.stroke();
    ctx.font = `${this.r * 1.15}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.label, 0, 1);
    ctx.restore();
  }
  hitTest(points) {
    if (this.sliced || points.length < 2) return false;
    const hitRadius = this.r * (isMobile ? 2.65 : 2.25);
    for (let i=1; i<points.length; i++) {
      const x1 = points[i-1].x, y1 = points[i-1].y;
      const x2 = points[i].x, y2 = points[i].y;
      const dx = x2-x1, dy = y2-y1;
      const len2 = dx*dx + dy*dy;
      if (len2 < 1) continue;
      const t = Math.max(0, Math.min(1, ((this.x-x1)*dx + (this.y-y1)*dy) / len2));
      const nx = x1 + t*dx, ny = y1 + t*dy;
      if (Math.hypot(this.x-nx, this.y-ny) < hitRadius) return true;
    }
    return false;
  }
}

function spawnInterval() { return Math.max(prefersLowPower ? 520 : 420, BASE_INTERVAL - score * 13); }
function maybeSpawn(now) {
  if (now - lastSpawn > spawnInterval()) {
    const count = score > 28 ? (Math.random() < .45 ? 2 : 1) : score > 12 ? (Math.random() < .25 ? 2 : 1) : 1;
    for (let i=0; i<count; i++) fruits.push(new Fruit());
    lastSpawn = now;
  }
}

function sliceFruit(f) {
  f.sliced = true;
  score += f.score || 1;
  comboCount++;
  comboTime = performance.now();
  const n = prefersLowPower ? 12 : 22;
  for (let i=0; i<n; i++) particles.push(new Particle(f.x, f.y, f.color));
  if (f.inner) for (let i=0; i<n/2; i++) particles.push(new Particle(f.x, f.y, f.inner));
}
function hitBomb(f) {
  f.sliced = true;
  lives--;
  comboCount = 0;
  flashRed = 18;
  shakeFrames = prefersLowPower ? 10 : 18;
  for (let i=0; i<(prefersLowPower ? 12 : 20); i++) particles.push(new Particle(f.x, f.y, '#333'));
  if (lives <= 0) endGame();
}
function endGame() {
  gameOver = true;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('fruitNinjaHighScore', String(highScore));
  }
}
function resetGame() {
  fruits = []; particles = []; trail = [];
  score = 0; lives = MAX_LIVES; gameOver = false; paused = false;
  flashRed = 0; shakeFrames = 0; comboCount = 0; pointer = null;
  lastSpawn = performance.now();
  pauseBtn.textContent = '⏸ Pause';
  pauseBtn.classList.remove('paused');
}

function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#071629');
  bg.addColorStop(.55, '#070817');
  bg.addColorStop(1, '#02030a');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = .15;
  ctx.fillStyle = '#00e5ff';
  for (let i=0; i<18; i++) {
    const x = (i * 211 + score * 7) % W;
    const y = (i * 97 + score * 3) % H;
    ctx.beginPath(); ctx.arc(x, y, 1.2, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawCamera() {
  if (video.readyState >= 2) {
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, -W, 0, W, H);
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,18,.43)';
    ctx.fillRect(0,0,W,H);
  } else {
    drawBackground();
  }
}
function drawHUD() {
  const s = scaleUnit();
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.lineJoin = 'round';
  const fs = Math.max(26, 36*s);
  ctx.font = `900 ${fs}px system-ui, sans-serif`;
  ctx.lineWidth = 7;
  ctx.strokeStyle = 'rgba(0,0,0,.75)';
  ctx.fillStyle = '#00ffbb';
  ctx.strokeText(`SCORE ${score}`, 14, 48*s + 12);
  ctx.fillText(`SCORE ${score}`, 14, 48*s + 12);
  ctx.font = `800 ${Math.max(14, 16*s)}px system-ui, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.fillText(`BEST ${highScore}`, 18, 75*s + 18);

  ctx.textAlign = 'right';
  ctx.font = `${Math.max(24, 33*s)}px serif`;
  const heartGap = Math.max(28, 38*s);
  const y = 48*s + 12;
  const rightPad = Math.max(12, isMobile ? 10 : 16);
  for (let i=0; i<MAX_LIVES; i++) {
    ctx.fillStyle = i < lives ? '#ff3355' : 'rgba(255,255,255,.22)';
    ctx.fillText('♥', W - rightPad - i*heartGap, y);
  }

  if (comboCount >= 3 && performance.now() - comboTime < 900) {
    const age = (performance.now() - comboTime) / 900;
    ctx.globalAlpha = 1 - age;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 28;
    ctx.font = `900 ${Math.max(34, 54*s - age*14)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#eaffff';
    ctx.fillText(`COMBO ×${comboCount}!`, W/2, H/2 - 65*s);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  ctx.font = `600 ${Math.max(11, 13*s)}px system-ui, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,.38)';
  ctx.fillText(isMobile ? 'Mobile optimized • CPU mode' : 'F Fullscreen • R Restart • P Pause • Mouse fallback', 10, H - 12);
  ctx.textAlign = 'right';
  ctx.fillText('Made by Dang Duc Minh', W - 10, H - 12);
  ctx.restore();
}
function drawTrail() {
  if (trail.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i=1; i<trail.length; i++) {
    const t = i / trail.length;
    ctx.beginPath();
    ctx.moveTo(trail[i-1].x, trail[i-1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.strokeStyle = `rgba(${80+t*130|0}, ${170+t*80|0}, 255, ${t*.88})`;
    ctx.lineWidth = Math.max(3, t * 9 * scaleUnit());
    ctx.shadowColor = '#00d5ff';
    ctx.shadowBlur = 12 * t;
    ctx.stroke();
  }
  ctx.restore();
}
function drawFingerDot() {
  const p = pointer || trail[trail.length - 1];
  if (!p) return;
  const s = scaleUnit();
  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x, p.y, 18*s, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,.16)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(p.x, p.y, 8*s, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(80,230,255,.92)';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 18;
  ctx.fill();
  ctx.restore();
}
function drawHandDots(landmarksList) {
  const s = scaleUnit();
  ctx.save();
  for (const lms of landmarksList) {
    for (const l of lms) {
      const x = (1 - l.x) * W;
      const y = l.y * H;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(2.2, 3.2*s), 0, Math.PI*2);
      ctx.fillStyle = 'rgba(180,255,180,.55)';
      ctx.fill();
    }
  }
  ctx.restore();
}
function drawGameOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.63)';
  ctx.fillRect(0,0,W,H);
  const win = score >= WIN_SCORE;
  const s = scaleUnit();
  ctx.textAlign = 'center';
  ctx.font = `900 ${Math.max(46, 78*s)}px system-ui, sans-serif`;
  ctx.fillStyle = win ? '#00ff88' : '#ff3355';
  ctx.shadowColor = win ? '#00ff88' : '#ff3355';
  ctx.shadowBlur = 24;
  ctx.fillText(win ? '🏆 YOU WIN!' : '💀 GAME OVER', W/2, H/2 - 32*s);
  ctx.shadowBlur = 0;
  ctx.font = `800 ${Math.max(25, 34*s)}px system-ui, sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.fillText(`Score: ${score}   Best: ${highScore}`, W/2, H/2 + 30*s);
  ctx.font = `600 ${Math.max(16, 21*s)}px system-ui, sans-serif`;
  ctx.fillStyle = '#c9d6df';
  ctx.fillText(isMobile ? 'Bấm Restart để chơi lại' : 'Nhấn R để chơi lại  |  F để Fullscreen', W/2, H/2 + 78*s);
  ctx.restore();
}
function drawPaused() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.46)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.font = `900 ${Math.max(42, 72*scaleUnit())}px system-ui, sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.fillText('⏸ PAUSED', W/2, H/2);
  ctx.restore();
}

function detectHand(now) {
  if (!handLandmarker || video.readyState < 2) return;
  if (now - lastDetectMs < DETECT_EVERY_MS) return;
  if (video.currentTime === lastVideoTime) return;
  lastDetectMs = now;
  lastVideoTime = video.currentTime;
  const result = handLandmarker.detectForVideo(video, now);
  if (result.landmarks && result.landmarks.length > 0) {
    const lm = result.landmarks[0];
    const tip = lm[8];
    const x = (1 - tip.x) * W;
    const y = tip.y * H;
    pointer = { x, y };
    trail.push(pointer);
    if (trail.length > TRAIL_LEN) trail.shift();
    drawHandDots(result.landmarks);
  } else if (!mouseDown) {
    pointer = null;
    trail = [];
  }
}

function gameLoop(now) {
  ctx.save();
  if (shakeFrames > 0) {
    ctx.translate(rand(-8,8) * scaleUnit(), rand(-8,8) * scaleUnit());
    shakeFrames--;
  }

  drawCamera();
  detectHand(now);

  if (flashRed > 0) {
    ctx.fillStyle = `rgba(220,0,0,${flashRed/18*.42})`;
    ctx.fillRect(0,0,W,H);
    flashRed--;
  }

  if (!paused && !gameOver) {
    maybeSpawn(now);
    const alive = [];
    for (const f of fruits) {
      const ok = f.update();
      if (ok) {
        if (f.hitTest(trail)) {
          if (f.name === 'bomb') hitBomb(f); else sliceFruit(f);
        } else alive.push(f);
      } else if (f.missed && f.name !== 'bomb') {
        lives--; comboCount = 0;
        if (lives <= 0) endGame();
      }
    }
    fruits = alive;
    if (score >= WIN_SCORE) endGame();
  }

  particles = particles.filter(p => { const alive = !paused && p.update(); p.draw(); return paused ? p.life > 0 : alive; });
  for (const f of fruits) f.draw();
  drawTrail();
  drawFingerDot();
  drawHUD();
  if (paused) drawPaused();
  if (gameOver) drawGameOver();
  ctx.restore();
  requestAnimationFrame(gameLoop);
}

let mouseDown = false;
function addPointer(x, y) {
  pointer = { x, y };
  trail.push(pointer);
  if (trail.length > TRAIL_LEN) trail.shift();
}
canvas.addEventListener('pointerdown', e => { mouseDown = true; addPointer(e.clientX, e.clientY); });
canvas.addEventListener('pointermove', e => { if (mouseDown) addPointer(e.clientX, e.clientY); });
window.addEventListener('pointerup', () => { mouseDown = false; if (!handLandmarker) { pointer = null; trail = []; } });

async function setupCamera() {
  if (activeStream) {
    activeStream.getTracks().forEach(t => t.stop());
    activeStream = null;
  }
  const constraints = {
    audio: false,
    video: {
      width: { ideal: prefersLowPower ? 960 : 1920 },
      height: { ideal: prefersLowPower ? 540 : 1080 },
      facingMode: cameraFacing
    }
  };
  activeStream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = activeStream;
  await video.play();
}

async function initMediaPipe() {
  if (handLandmarker) return;
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
      delegate: "CPU"
    },
    runningMode: "VIDEO",
    numHands: prefersLowPower ? 1 : 2,
    minHandDetectionConfidence: prefersLowPower ? 0.62 : 0.55,
    minHandPresenceConfidence: prefersLowPower ? 0.62 : 0.55,
    minTrackingConfidence: 0.5
  });
}

async function startGame() {
  startBtn.disabled = true;
  startBtn.textContent = 'Đang khởi động...';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Trình duyệt không hỗ trợ camera hoặc trang chưa chạy HTTPS/localhost.');
    statusEl.textContent = 'Đang mở camera...';
    await setupCamera();
    statusEl.textContent = 'Camera OK. Đang tải MediaPipe...';
    await initMediaPipe();
    statusEl.textContent = prefersLowPower ? 'Mobile mode: CPU + giảm tần suất detect để mượt hơn' : '';
    startOverlay.style.display = 'none';
    resetGame();
    if (!rafStarted) {
      rafStarted = true;
      requestAnimationFrame(gameLoop);
    }
  } catch (e) {
    statusEl.textContent = '⚠️ ' + e.message;
    startBtn.disabled = false;
    startBtn.textContent = '▶ Start Game';
  }
}

startBtn.addEventListener('click', startGame);
fullscreenBtn.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch(e) { statusEl.textContent = 'Không bật được Fullscreen: ' + e.message; }
});
restartBtn.addEventListener('click', resetGame);
pauseBtn.addEventListener('click', () => {
  paused = !paused;
  pauseBtn.textContent = paused ? '▶ Resume' : '⏸ Pause';
  pauseBtn.classList.toggle('paused', paused);
});
cameraBtn.addEventListener('click', async () => {
  cameraFacing = cameraFacing === 'user' ? 'environment' : 'user';
  try {
    statusEl.textContent = 'Đang đổi camera...';
    await setupCamera();
    statusEl.textContent = '';
  } catch(e) {
    statusEl.textContent = 'Không đổi được camera: ' + e.message;
    cameraFacing = cameraFacing === 'user' ? 'environment' : 'user';
  }
});

document.addEventListener('keydown', async e => {
  if (e.repeat) return;
  if (e.key === 'r' || e.key === 'R') resetGame();
  if (e.key === 'p' || e.key === 'P') pauseBtn.click();
  if (e.key === 'f' || e.key === 'F') fullscreenBtn.click();
  if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
});

// Draw idle screen before Start
(function idle(){
  if (!rafStarted) {
    drawBackground();
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = `900 ${Math.max(32, Math.min(W,H)*0.08)}px system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillText('🍉 Fruit Ninja Camera', W/2, H/2 - 16);
    ctx.font = `600 ${Math.max(14, Math.min(W,H)*0.025)}px system-ui, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fillText('Nhấn Start để bắt đầu', W/2, H/2 + 34);
    ctx.restore();
    requestAnimationFrame(idle);
  }
})();
</script>
